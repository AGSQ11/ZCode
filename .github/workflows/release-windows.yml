# Windows installer release workflow.
# 打包入口以 packages/desktop/scripts/bundle.mjs 为准：prepare:runtime-assets → build →
# electron-builder(--win --x64) → 运行时依赖闭包校验 → 体积审计。产物落在 packages/desktop/dist/*.exe。
# 版本号来源：build-metadata.mjs 读根 package.json 的 version 作为 appVersion；
# release-it(.release-it.mjs) 约定 tag 为 v${version}，故 tag 触发时直接用 tag 名做发布版本。

name: Release Windows Installer

on:
  # 手动触发：构建当前分支的 Windows 安装包并作为 workflow artifact 上传（不发 GitHub Release）。
  workflow_dispatch:
  # 打 tag 触发：以 v* 标签发布正式 GitHub Release 并附上安装包。
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 与 mise.toml 的 [env] 对齐；electron-builder 也用该镜像取 Electron runtime / builder binaries。
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
      NPM_CONFIG_ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
      # 生产身份：ZCODE_ENV=production 才能出正式 ZCode 安装包（默认会落到 Preview 身份）。
      ZCODE_ENV: "production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # electron-builder / build-metadata 需要 git 历史（commit id、tag）。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          # tag 触发：v* tag 去掉前缀 v 即为版本号；手动触发：读根 package.json 的 version。
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $v = $pkg.version
          }
          Write-Output "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved release version: $v"

      - name: Build Windows installer
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-windows-installer-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release with installer
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZCode ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: packages/desktop/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
